<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200">
  <defs>
    <style>
      /* ═══ Animated Potion Bottles — Skills Mastery ═══ */

      /* Liquid filling animation */
      .liquid-fill {
        animation: fillLiquid 3s ease-in-out forwards;
        transform-origin: bottom center;
      }
      .l1 { animation-delay: 0.2s; }
      .l2 { animation-delay: 0.5s; }
      .l3 { animation-delay: 0.8s; }
      .l4 { animation-delay: 1.1s; }
      .l5 { animation-delay: 1.4s; }

      @keyframes fillLiquid {
        0% { transform: scaleY(0); }
        100% { transform: scaleY(1); }
      }

      /* Liquid surface wave */
      .surface-wave {
        animation: waveBob 2s ease-in-out infinite alternate;
        transform-origin: center;
      }
      @keyframes waveBob {
        0% { transform: scaleX(0.9) translateY(1px); }
        100% { transform: scaleX(1.1) translateY(-1px); }
      }

      /* Rising Bubbles */
      .bubble { opacity: 0; }
      
      /* Bottle 1 Bubbles */
      .b1-1 { animation: bubbleRise 2s ease-in infinite; animation-delay: 0.5s; }
      .b1-2 { animation: bubbleRise 2.5s ease-in infinite; animation-delay: 1.2s; }
      .b1-3 { animation: bubbleRise 1.8s ease-in infinite; animation-delay: 2.1s; }
      
      /* Bottle 2 Bubbles */
      .b2-1 { animation: bubbleRise 2.2s ease-in infinite; animation-delay: 0.8s; }
      .b2-2 { animation: bubbleRise 1.9s ease-in infinite; animation-delay: 1.5s; }
      .b2-3 { animation: bubbleRise 2.7s ease-in infinite; animation-delay: 2.4s; }

      /* Bottle 3 Bubbles */
      .b3-1 { animation: bubbleRise 2.4s ease-in infinite; animation-delay: 1.1s; }
      .b3-2 { animation: bubbleRise 1.7s ease-in infinite; animation-delay: 1.8s; }
      .b3-3 { animation: bubbleRise 2.3s ease-in infinite; animation-delay: 2.9s; }

      /* Bottle 4 Bubbles */
      .b4-1 { animation: bubbleRise 2.1s ease-in infinite; animation-delay: 1.4s; }
      .b4-2 { animation: bubbleRise 2.6s ease-in infinite; animation-delay: 2.2s; }
      .b4-3 { animation: bubbleRise 1.9s ease-in infinite; animation-delay: 3.1s; }

      /* Bottle 5 Bubbles */
      .b5-1 { animation: bubbleRise 2.3s ease-in infinite; animation-delay: 1.7s; }
      .b5-2 { animation: bubbleRise 1.8s ease-in infinite; animation-delay: 2.5s; }
      .b5-3 { animation: bubbleRise 2.5s ease-in infinite; animation-delay: 3.4s; }

      @keyframes bubbleRise {
        0% { opacity: 0; transform: translateY(0) scale(0.5); }
        20% { opacity: 0.8; transform: scale(1); }
        80% { opacity: 0.8; }
        100% { opacity: 0; transform: translateY(var(--dy, -40px)) scale(0.8); }
      }

      /* Glow effect */
      .glow-pulse {
        animation: glowPulse 3s ease-in-out infinite alternate;
      }
      .g1 { animation-delay: 0s; }
      .g2 { animation-delay: 0.5s; }
      .g3 { animation-delay: 1s; }
      .g4 { animation-delay: 1.5s; }
      .g5 { animation-delay: 2s; }

      @keyframes glowPulse {
        0% { opacity: 0.2; }
        100% { opacity: 0.6; }
      }

      /* Label text fade in */
      .label-text {
        opacity: 0;
        animation: fadeIn 1s ease-out 2.5s forwards;
      }
      @keyframes fadeIn {
        0% { opacity: 0; transform: translateY(5px); }
        100% { opacity: 1; transform: translateY(0); }
      }
    </style>

    <filter id="blurGlow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Potion Gradients -->
    <!-- Python: Felix Felicis (Gold) -->
    <linearGradient id="pot1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="50%" stop-color="#FFFAF0"/>
      <stop offset="100%" stop-color="#DAA520"/>
    </linearGradient>

    <!-- TypeScript: Veritaserum (Clear/Blue) -->
    <linearGradient id="pot2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4169E1"/>
      <stop offset="50%" stop-color="#E0FFFF"/>
      <stop offset="100%" stop-color="#0000CD"/>
    </linearGradient>

    <!-- React: Amortentia (Pink/Pearl) -->
    <linearGradient id="pot3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF1493"/>
      <stop offset="50%" stop-color="#FFF0F5"/>
      <stop offset="100%" stop-color="#C71585"/>
    </linearGradient>

    <!-- Rust/Go: Polyjuice (Green/Muddy) -->
    <linearGradient id="pot4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#228B22"/>
      <stop offset="50%" stop-color="#98FB98"/>
      <stop offset="100%" stop-color="#006400"/>
    </linearGradient>

    <!-- AWS/DevOps: Draught of Peace (Silver/Purple) -->
    <linearGradient id="pot5" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9370DB"/>
      <stop offset="50%" stop-color="#E6E6FA"/>
      <stop offset="100%" stop-color="#4B0082"/>
    </linearGradient>

    <!-- Glass reflections -->
    <linearGradient id="glassReflect" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="20%" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="80%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.2"/>
    </linearGradient>

    <radialGradient id="cork" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D2B48C"/>
      <stop offset="100%" stop-color="#8B4513"/>
    </radialGradient>
  </defs>

  <!-- ═══ Title ═══ -->
  <text x="400" y="25" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="16" letter-spacing="4" fill="#EEBA30" opacity="0.8">
    N.E.W.T. LEVEL POTIONS
  </text>
  <text x="400" y="45" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="10" letter-spacing="2" fill="#8b949e" opacity="0.6">
    SKILL MASTERY BREWS
  </text>

  <!-- ═══ BOTTLE 1: Python (Felix Felicis) - 90% ═══ -->
  <g transform="translate(100, 150)">
    <!-- Background Glow -->
    <ellipse class="glow-pulse g1" cx="0" cy="-45" rx="35" ry="45" fill="#FFD700" filter="url(#blurGlow)"/>
    
    <!-- Liquid mask -->
    <clipPath id="flaskMask1">
      <!-- Teardrop shape -->
      <path d="M-20,-75 L-10,-55 C-30,-20 -35,5 0,15 C35,5 30,-20 10,-55 L20,-75 Z"/>
    </clipPath>
    
    <!-- Liquid content -->
    <g clip-path="url(#flaskMask1)">
      <!-- Fill height: adjust transform translate for level (90%) -->
      <g class="liquid-fill l1" transform="translate(0, 15)">
        <rect x="-40" y="-75" width="80" height="80" fill="url(#pot1)"/>
        <!-- Surface ellipse -->
        <ellipse class="surface-wave" cx="0" cy="-75" rx="25" ry="4" fill="#FFFAF0"/>
      </g>
    </g>

    <!-- Bubbles -->
    <circle class="bubble b1-1" style="--dy: -55px" cx="-10" cy="5" r="2" fill="#ffffff"/>
    <circle class="bubble b1-2" style="--dy: -65px" cx="8" cy="10" r="1.5" fill="#ffffff"/>
    <circle class="bubble b1-3" style="--dy: -50px" cx="2" cy="0" r="2.5" fill="#ffffff"/>

    <!-- Glass bottle Outline -->
    <path d="M-10,-95 L-10,-70 L-15,-60 C-40,-15 -45,10 0,20 C45,10 40,-15 15,-60 L10,-70 L10,-95 Z" fill="none" stroke="#8b949e" stroke-width="2" opacity="0.6"/>
    <!-- Glass reflection -->
    <path d="M-10,-95 L-10,-70 L-15,-60 C-40,-15 -45,10 0,20 C45,10 40,-15 15,-60 L10,-70 L10,-95 Z" fill="url(#glassReflect)"/>
    <!-- Bottle rim -->
    <rect x="-14" y="-98" width="28" height="5" rx="2" fill="none" stroke="#8b949e" stroke-width="2" opacity="0.6"/>
    <rect x="-14" y="-98" width="28" height="5" rx="2" fill="url(#glassReflect)"/>
    <!-- Cork -->
    <rect x="-8" y="-105" width="16" height="8" rx="2" fill="url(#cork)"/>

    <!-- Labels -->
    <text class="label-text" x="0" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="12" fill="#E5E7EB">Python</text>
    <text class="label-text" x="0" y="60" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="10" fill="#FFD700">Felix Felicis</text>
  </g>

  <!-- ═══ BOTTLE 2: TypeScript (Veritaserum) - 85% ═══ -->
  <g transform="translate(250, 150)">
    <!-- Background Glow -->
    <ellipse class="glow-pulse g2" cx="0" cy="-35" rx="35" ry="35" fill="#4169E1" filter="url(#blurGlow)"/>
    
    <clipPath id="flaskMask2">
      <!-- Round bottom flask -->
      <path d="M-12,-70 L-12,-45 A30,30 0 1,0 12,-45 L12,-70 Z"/>
    </clipPath>
    
    <g clip-path="url(#flaskMask2)">
      <!-- Fill height: 85% -->
      <g class="liquid-fill l2" transform="translate(0, 15)">
        <rect x="-40" y="-70" width="80" height="75" fill="url(#pot2)"/>
        <ellipse class="surface-wave" cx="0" cy="-70" rx="15" ry="3" fill="#E0FFFF"/>
      </g>
    </g>

    <circle class="bubble b2-1" style="--dy: -50px" cx="-15" cy="5" r="2.5" fill="#ffffff"/>
    <circle class="bubble b2-2" style="--dy: -60px" cx="12" cy="8" r="1.5" fill="#ffffff"/>
    <circle class="bubble b2-3" style="--dy: -45px" cx="-5" cy="-2" r="2" fill="#ffffff"/>

    <!-- Glass bottle -->
    <path d="M-12,-85 L-12,-45 A30,30 0 1,0 12,-45 L12,-85 Z" fill="none" stroke="#8b949e" stroke-width="2" opacity="0.6"/>
    <path d="M-12,-85 L-12,-45 A30,30 0 1,0 12,-45 L12,-85 Z" fill="url(#glassReflect)"/>
    <rect x="-16" y="-88" width="32" height="5" rx="2" fill="none" stroke="#8b949e" stroke-width="2" opacity="0.6"/>
    <rect x="-16" y="-88" width="32" height="5" rx="2" fill="url(#glassReflect)"/>
    <rect x="-10" y="-95" width="20" height="8" rx="2" fill="url(#cork)"/>

    <text class="label-text" x="0" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="12" fill="#E5E7EB">TypeScript</text>
    <text class="label-text" x="0" y="60" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="10" fill="#4169E1">Veritaserum</text>
  </g>

  <!-- ═══ BOTTLE 3: React (Amortentia) - 95% ═══ -->
  <g transform="translate(400, 150)">
    <!-- Background Glow -->
    <ellipse class="glow-pulse g3" cx="0" cy="-40" rx="38" ry="40" fill="#FF1493" filter="url(#blurGlow)"/>
    
    <clipPath id="flaskMask3">
      <!-- Erlenmeyer flask -->
      <path d="M-15,-70 L-15,-50 L-35,10 C-38,15 -30,20 0,20 C30,20 38,15 35,10 L15,-50 L15,-70 Z"/>
    </clipPath>
    
    <g clip-path="url(#flaskMask3)">
      <!-- Fill height: 95% -->
      <g class="liquid-fill l3" transform="translate(0, 20)">
        <rect x="-45" y="-85" width="90" height="90" fill="url(#pot3)"/>
        <ellipse class="surface-wave" cx="0" cy="-85" rx="18" ry="3" fill="#FFF0F5"/>
      </g>
    </g>

    <circle class="bubble b3-1" style="--dy: -70px" cx="-20" cy="10" r="2" fill="#ffffff"/>
    <circle class="bubble b3-2" style="--dy: -80px" cx="15" cy="5" r="2.5" fill="#ffffff"/>
    <circle class="bubble b3-3" style="--dy: -65px" cx="0" cy="12" r="1.5" fill="#ffffff"/>

    <!-- Glass bottle -->
    <path d="M-15,-90 L-15,-50 L-35,10 C-38,15 -30,20 0,20 C30,20 38,15 35,10 L15,-50 L15,-90 Z" fill="none" stroke="#8b949e" stroke-width="2" opacity="0.6"/>
    <path d="M-15,-90 L-15,-50 L-35,10 C-38,15 -30,20 0,20 C30,20 38,15 35,10 L15,-50 L15,-90 Z" fill="url(#glassReflect)"/>
    <rect x="-19" y="-93" width="38" height="5" rx="2" fill="none" stroke="#8b949e" stroke-width="2" opacity="0.6"/>
    <rect x="-19" y="-93" width="38" height="5" rx="2" fill="url(#glassReflect)"/>
    <rect x="-12" y="-100" width="24" height="8" rx="2" fill="url(#cork)"/>

    <text class="label-text" x="0" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="12" fill="#E5E7EB">React</text>
    <text class="label-text" x="0" y="60" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="10" fill="#FF1493">Amortentia</text>
  </g>

  <!-- ═══ BOTTLE 4: Systems (Polyjuice) - 75% ═══ -->
  <g transform="translate(550, 150)">
    <!-- Background Glow -->
    <ellipse class="glow-pulse g4" cx="0" cy="-35" rx="32" ry="45" fill="#228B22" filter="url(#blurGlow)"/>
    
    <clipPath id="flaskMask4">
      <!-- Tall vial -->
      <rect x="-20" y="-70" width="40" height="85" rx="10"/>
    </clipPath>
    
    <g clip-path="url(#flaskMask4)">
      <!-- Fill height: 75% -->
      <g class="liquid-fill l4" transform="translate(0, 15)">
        <rect x="-25" y="-55" width="50" height="60" fill="url(#pot4)"/>
        <ellipse class="surface-wave" cx="0" cy="-55" rx="20" ry="3" fill="#98FB98"/>
      </g>
    </g>

    <circle class="bubble b4-1" style="--dy: -50px" cx="-10" cy="5" r="2" fill="#ffffff"/>
    <circle class="bubble b4-2" style="--dy: -45px" cx="8" cy="10" r="1.5" fill="#ffffff"/>
    <circle class="bubble b4-3" style="--dy: -55px" cx="2" cy="-2" r="2.5" fill="#ffffff"/>

    <!-- Glass bottle -->
    <rect x="-20" y="-85" width="40" height="100" rx="10" fill="none" stroke="#8b949e" stroke-width="2" opacity="0.6"/>
    <rect x="-20" y="-85" width="40" height="100" rx="10" fill="url(#glassReflect)"/>
    <rect x="-24" y="-88" width="48" height="5" rx="2" fill="none" stroke="#8b949e" stroke-width="2" opacity="0.6"/>
    <rect x="-24" y="-88" width="48" height="5" rx="2" fill="url(#glassReflect)"/>
    <rect x="-16" y="-95" width="32" height="8" rx="2" fill="url(#cork)"/>

    <text class="label-text" x="0" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="12" fill="#E5E7EB">Rust / Go</text>
    <text class="label-text" x="0" y="60" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="10" fill="#228B22">Polyjuice</text>
  </g>

  <!-- ═══ BOTTLE 5: DevOps (Draught of Peace) - 80% ═══ -->
  <g transform="translate(700, 150)">
    <!-- Background Glow -->
    <ellipse class="glow-pulse g5" cx="0" cy="-35" rx="40" ry="35" fill="#9370DB" filter="url(#blurGlow)"/>
    
    <clipPath id="flaskMask5">
      <!-- Hexagonal / Diamond flask -->
      <polygon points="0,-70 25,-40 30,-5 0,15 -30,-5 -25,-40"/>
    </clipPath>
    
    <g clip-path="url(#flaskMask5)">
      <!-- Fill height: 80% -->
      <g class="liquid-fill l5" transform="translate(0, 15)">
        <rect x="-35" y="-60" width="70" height="70" fill="url(#pot5)"/>
        <ellipse class="surface-wave" cx="0" cy="-60" rx="20" ry="3" fill="#E6E6FA"/>
      </g>
    </g>

    <circle class="bubble b5-1" style="--dy: -55px" cx="-15" cy="5" r="2.5" fill="#ffffff"/>
    <circle class="bubble b5-2" style="--dy: -45px" cx="12" cy="0" r="1.5" fill="#ffffff"/>
    <circle class="bubble b5-3" style="--dy: -60px" cx="-5" cy="8" r="2" fill="#ffffff"/>

    <!-- Glass bottle -->
    <path d="M-10,-90 L-10,-70 L-25,-40 L-30,-5 L0,15 L30,-5 L25,-40 L10,-70 L10,-90 Z" fill="none" stroke="#8b949e" stroke-width="2" opacity="0.6"/>
    <path d="M-10,-90 L-10,-70 L-25,-40 L-30,-5 L0,15 L30,-5 L25,-40 L10,-70 L10,-90 Z" fill="url(#glassReflect)"/>
    <rect x="-14" y="-93" width="28" height="5" rx="2" fill="none" stroke="#8b949e" stroke-width="2" opacity="0.6"/>
    <rect x="-14" y="-93" width="28" height="5" rx="2" fill="url(#glassReflect)"/>
    <rect x="-8" y="-100" width="16" height="8" rx="2" fill="url(#cork)"/>

    <text class="label-text" x="0" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="12" fill="#E5E7EB">DevOps</text>
    <text class="label-text" x="0" y="60" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="10" fill="#9370DB">Draught of Peace</text>
  </g>
</svg>
