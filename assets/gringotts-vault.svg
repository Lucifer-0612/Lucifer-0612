<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="100%">
  <defs>
    <!-- Background textures -->
    <radialGradient id="vaultBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2a2a2a" />
      <stop offset="100%" stop-color="#0a0a0a" />
    </radialGradient>
    
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFDF73" />
      <stop offset="50%" stop-color="#EEBA30" />
      <stop offset="100%" stop-color="#B8860B" />
    </linearGradient>

    <!-- Coin animation -->
    <style>
      .door-left {
        transform-origin: 0% 50%;
        animation: openLeft 3s ease-in-out forwards;
        animation-delay: 1s;
      }
      .door-right {
        transform-origin: 100% 50%;
        animation: openRight 3s ease-in-out forwards;
        animation-delay: 1s;
      }
      
      @keyframes openLeft {
        0% { transform: scaleX(1); }
        100% { transform: scaleX(0.1); }
      }
      @keyframes openRight {
        0% { transform: scaleX(1); }
        100% { transform: scaleX(0.1); }
      }
      
      .coin {
        opacity: 0;
        transform: translateY(20px);
        animation: coinDrop 0.5s ease-out forwards;
      }
      
      @keyframes coinDrop {
        0% { opacity: 0; transform: translateY(-20px) scale(0.5); }
        50% { opacity: 1; transform: translateY(0) scale(1.1); }
        100% { opacity: 1; transform: translateY(0) scale(1); }
      }

      .glow {
        animation: pulse 2s infinite alternate;
      }
      
      @keyframes pulse {
        0% { opacity: 0.5; }
        100% { opacity: 1; }
      }
    </style>
  </defs>

  <!-- Vault 1: Pull Shark -->
  <g transform="translate(100, 20)">
    <!-- Vault Interior (visible when open) -->
    <rect x="0" y="0" width="160" height="160" rx="8" fill="url(#vaultBg)" stroke="#333" stroke-width="2"/>
    
    <!-- Treasures -->
    <circle cx="80" cy="80" r="40" fill="url(#goldGradient)" class="glow" />
    <path d="M80 50 L100 100 L60 100 Z" fill="#0d1117" opacity="0.8" /> <!-- Abstract shark fin -->
    <text x="80" y="140" fill="#EEBA30" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">Pull Shark x2</text>
    
    <!-- Vault Doors (animate open) -->
    <rect x="0" y="0" width="80" height="160" rx="4" fill="#1a1a1a" stroke="#444" stroke-width="2" class="door-left" />
    <circle cx="70" cy="80" r="8" fill="#333" class="door-left" /> <!-- Lock mechanism -->
    <rect x="80" y="0" width="80" height="160" rx="4" fill="#1a1a1a" stroke="#444" stroke-width="2" class="door-right" />
    
    <!-- Vault Number Plaque (on top of doors) -->
    <rect x="50" y="20" width="60" height="30" rx="4" fill="url(#goldGradient)" class="door-left"/>
    <text x="80" y="40" fill="#1a1a1a" font-family="Georgia" font-size="18" font-weight="bold" text-anchor="middle" class="door-left">612</text>
  </g>

  <!-- Vault 2: Pro -->
  <g transform="translate(320, 20)">
    <!-- Vault Interior -->
    <rect x="0" y="0" width="160" height="160" rx="8" fill="url(#vaultBg)" stroke="#333" stroke-width="2"/>
    
    <!-- Treasures -->
    <circle cx="80" cy="80" r="45" fill="url(#goldGradient)" class="glow" />
    <text x="80" y="85" fill="#1a1a1a" font-family="Georgia" font-size="24" font-weight="bold" text-anchor="middle">PRO</text>
    <text x="80" y="140" fill="#EEBA30" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">GitHub Pro</text>
    
    <!-- Vault Doors -->
    <rect x="0" y="0" width="80" height="160" rx="4" fill="#1a1a1a" stroke="#444" stroke-width="2" class="door-left" style="animation-delay: 1.5s" />
    <circle cx="70" cy="80" r="8" fill="#333" class="door-left" style="animation-delay: 1.5s" />
    <rect x="80" y="0" width="80" height="160" rx="4" fill="#1a1a1a" stroke="#444" stroke-width="2" class="door-right" style="animation-delay: 1.5s" />
    
    <!-- Vault Number Plaque -->
    <rect x="50" y="20" width="60" height="30" rx="4" fill="url(#goldGradient)" class="door-left" style="animation-delay: 1.5s"/>
    <text x="80" y="40" fill="#1a1a1a" font-family="Georgia" font-size="18" font-weight="bold" text-anchor="middle" class="door-left" style="animation-delay: 1.5s">713</text>
  </g>

  <!-- Vault 3: Open Source -->
  <g transform="translate(540, 20)">
    <!-- Vault Interior -->
    <rect x="0" y="0" width="160" height="160" rx="8" fill="url(#vaultBg)" stroke="#333" stroke-width="2"/>
    
    <!-- Treasures -->
    <!-- Pile of galleons -->
    <circle cx="70" cy="90" r="15" fill="url(#goldGradient)" class="coin" style="animation-delay: 3s" />
    <circle cx="90" cy="85" r="15" fill="url(#goldGradient)" class="coin" style="animation-delay: 3.2s" />
    <circle cx="80" cy="70" r="15" fill="url(#goldGradient)" class="coin" style="animation-delay: 3.4s" />
    <circle cx="65" cy="75" r="15" fill="url(#goldGradient)" class="coin" style="animation-delay: 3.6s" />
    <circle cx="95" cy="70" r="15" fill="url(#goldGradient)" class="coin" style="animation-delay: 3.8s" />
    <circle cx="80" cy="55" r="15" fill="url(#goldGradient)" class="coin" style="animation-delay: 4.0s" />
    <text x="80" y="140" fill="#EEBA30" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">51 Repositories</text>
    
    <!-- Vault Doors -->
    <rect x="0" y="0" width="80" height="160" rx="4" fill="#1a1a1a" stroke="#444" stroke-width="2" class="door-left" style="animation-delay: 2s" />
    <circle cx="70" cy="80" r="8" fill="#333" class="door-left" style="animation-delay: 2s" />
    <rect x="80" y="0" width="80" height="160" rx="4" fill="#1a1a1a" stroke="#444" stroke-width="2" class="door-right" style="animation-delay: 2s" />
    
    <!-- Vault Number Plaque -->
    <rect x="50" y="20" width="60" height="30" rx="4" fill="url(#goldGradient)" class="door-left" style="animation-delay: 2s"/>
    <text x="80" y="40" fill="#1a1a1a" font-family="Georgia" font-size="18" font-weight="bold" text-anchor="middle" class="door-left" style="animation-delay: 2s">998</text>
  </g>
</svg>
