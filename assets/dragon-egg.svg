<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <style>
      /* ═══ Animated Dragon Egg Easter Egg ═══ */

      /* Egg wobble */
      .egg-wobble {
        animation: wobble 6s ease-in-out infinite;
        transform-origin: 200px 240px;
      }
      @keyframes wobble {
        0%, 80%, 100% { transform: rotate(0deg); }
        82% { transform: rotate(5deg); }
        84% { transform: rotate(-4deg); }
        86% { transform: rotate(3deg); }
        88% { transform: rotate(-2deg); }
        90% { transform: rotate(1deg); }
        92% { transform: rotate(0deg); }
      }

      /* Glowing cracks */
      .crack-glow {
        animation: glowPulse 6s ease-in-out infinite;
      }
      @keyframes glowPulse {
        0%, 80%, 100% { opacity: 0.1; stroke-width: 1; }
        86% { opacity: 0.8; stroke-width: 2.5; }
        92% { opacity: 0.2; stroke-width: 1.5; }
      }

      /* Eye peek inside the crack */
      .dragon-eye {
        animation: eyeBlink 6s ease-in-out infinite;
      }
      @keyframes eyeBlink {
        0%, 85%, 95%, 100% { transform: scaleY(0); opacity: 0; }
        88%, 92% { transform: scaleY(1); opacity: 1; }
        90% { transform: scaleY(0.1); opacity: 1; }
      }

      /* Eye pupil scanning */
      .pupil-scan {
        animation: pupilMove 6s ease-in-out infinite;
      }
      @keyframes pupilMove {
        0%, 85%, 100% { transform: translateX(0); }
        88% { transform: translateX(-2px); }
        92% { transform: translateX(2px); }
      }

      /* Smoke wisps escaping from the cracks */
      .smoke-wisp { opacity: 0; }
      .sw1 { animation: smokeRise 6s ease-out infinite; animation-delay: 4.8s; }
      .sw2 { animation: smokeRise 6s ease-out infinite; animation-delay: 5.1s; }
      .sw3 { animation: smokeRise 6s ease-out infinite; animation-delay: 5.4s; }

      @keyframes smokeRise {
        0% { opacity: 0; transform: translate(0, 0) scale(0.5); }
        20% { opacity: 0.6; transform: scale(1.2); }
        50% { opacity: 0; transform: translate(var(--dx, 20px), -40px) scale(1.5); }
        100% { opacity: 0; }
      }

      /* Embers */
      .ember { opacity: 0; }
      .em1 { animation: emberPop 6s ease-out infinite; animation-delay: 5.0s; }
      .em2 { animation: emberPop 6s ease-out infinite; animation-delay: 5.2s; }
      .em3 { animation: emberPop 6s ease-out infinite; animation-delay: 5.3s; }

      @keyframes emberPop {
        0% { opacity: 0; transform: translate(0, 0) scale(0); }
        15% { opacity: 1; transform: translate(var(--dx, 10px), -10px) scale(1.5); }
        40% { opacity: 0; transform: translate(var(--dx, 15px), -25px) scale(0); }
        100% { opacity: 0; }
      }
    </style>

    <!-- Egg scale pattern gradient -->
    <radialGradient id="eggBase" cx="40%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#4A5D23"/>
      <stop offset="50%" stop-color="#2D3B14"/>
      <stop offset="100%" stop-color="#141C09"/>
    </radialGradient>

    <!-- Crack inner glow -->
    <linearGradient id="crackLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="50%" stop-color="#FF8C00"/>
      <stop offset="100%" stop-color="#8B0000"/>
    </linearGradient>

    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Title / Hint -->
  <text x="200" y="40" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="14" letter-spacing="3" fill="#EEBA30" opacity="0.7">
    DANGER: NORWEGIAN RIDGEBACK EGG
  </text>
  <text x="200" y="60" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="10" letter-spacing="1" fill="#8b949e" opacity="0.5">
    (Keep away from open flames)
  </text>

  <!-- ═══ The Egg ═══ -->
  <g class="egg-wobble">
    <!-- Egg shadow -->
    <ellipse cx="200" cy="245" rx="65" ry="12" fill="#000000" opacity="0.4"/>

    <!-- Main egg body -->
    <path d="M140,220 C140,260 160,250 200,250 C240,250 260,260 260,220 C260,160 235,90 200,90 C165,90 140,160 140,220 Z" fill="url(#eggBase)"/>
    
    <!-- Egg scales (stylized) -->
    <g stroke="#141C09" stroke-width="1.5" fill="none" opacity="0.6">
      <path d="M160,130 Q170,145 180,130"/>
      <path d="M185,125 Q195,140 205,125"/>
      <path d="M210,130 Q220,145 230,130"/>

      <path d="M150,160 Q162,175 175,160"/>
      <path d="M180,155 Q195,175 210,155"/>
      <path d="M215,160 Q228,175 240,160"/>

      <path d="M145,195 Q158,215 170,195"/>
      <path d="M175,190 Q190,210 205,190"/>
      <path d="M210,195 Q225,215 240,195"/>

      <path d="M165,225 Q180,245 195,225"/>
      <path d="M200,225 Q215,245 230,225"/>
    </g>

    <!-- The Crack (dark underlayer) -->
    <path d="M175,120 L182,135 L170,150 L195,165 L180,185 L190,200 L175,215" fill="none" stroke="#000000" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/>

    <!-- The Eye (inside the crack) -->
    <g class="dragon-eye" transform="translate(182, 172)">
      <ellipse cx="0" cy="0" rx="4" ry="7" fill="#FFD700"/>
      <!-- Slit pupil -->
      <g class="pupil-scan">
        <ellipse cx="0" cy="0" rx="1" ry="5" fill="#000000"/>
      </g>
    </g>

    <!-- The Crack (glowing overlayer) -->
    <path class="crack-glow" d="M175,120 L182,135 L170,150 L195,165 L180,185 L190,200 L175,215" fill="none" stroke="url(#crackLight)" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" filter="url(#glowFilter)"/>

    <!-- Egg highlights -->
    <path d="M160,115 C175,100 195,95 210,105" fill="none" stroke="#7A8B43" stroke-width="4" stroke-linecap="round" opacity="0.3" filter="url(#glowFilter)"/>
    <path d="M150,150 C145,180 150,210 160,230" fill="none" stroke="#7A8B43" stroke-width="6" stroke-linecap="round" opacity="0.15" filter="url(#glowFilter)"/>
  </g>

  <!-- ═══ Smoke Wisps ═══ -->
  <g transform="translate(185, 120)">
    <circle class="smoke-wisp sw1" style="--dx: -15px" cx="0" cy="0" r="12" fill="#5c5c5c" filter="url(#glowFilter)"/>
    <circle class="smoke-wisp sw2" style="--dx: 5px" cx="-5" cy="5" r="15" fill="#404040" filter="url(#glowFilter)"/>
    <circle class="smoke-wisp sw3" style="--dx: 25px" cx="5" cy="10" r="10" fill="#303030" filter="url(#glowFilter)"/>
  </g>

  <!-- ═══ Embers ═══ -->
  <g transform="translate(180, 140)">
    <circle class="ember em1" style="--dx: -25px" cx="0" cy="0" r="2.5" fill="#FF8C00" filter="url(#glowFilter)"/>
    <circle class="ember em2" style="--dx: -5px" cx="5" cy="5" r="2" fill="#FFD700" filter="url(#glowFilter)"/>
    <circle class="ember em3" style="--dx: 20px" cx="2" cy="15" r="3" fill="#FF4500" filter="url(#glowFilter)"/>
  </g>
</svg>
