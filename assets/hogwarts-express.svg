<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 140" width="800" height="140">
  <defs>
    <style>
      /* ═══ Hogwarts Express — Animated Progress Journey ═══ */

      /* Train movement — rolls across the track */
      .train {
        animation: trainRoll 8s ease-in-out infinite;
      }
      @keyframes trainRoll {
        0% { transform: translateX(-120px); opacity: 0; }
        10% { opacity: 1; }
        45% { transform: translateX(280px); }
        55% { transform: translateX(280px); }
        90% { opacity: 1; }
        100% { transform: translateX(700px); opacity: 0; }
      }

      /* Smoke puffs from chimney */
      .smoke { opacity: 0; }
      .sm1 { animation: smokePuff 2s ease-out 0s infinite; }
      .sm2 { animation: smokePuff 2s ease-out 0.5s infinite; }
      .sm3 { animation: smokePuff 2s ease-out 1s infinite; }
      .sm4 { animation: smokePuff 2s ease-out 1.5s infinite; }

      @keyframes smokePuff {
        0% { opacity: 0; transform: translate(0, 0) scale(0.3); }
        20% { opacity: 0.4; }
        100% { opacity: 0; transform: translate(-40px, -25px) scale(2); }
      }

      /* Wheel rotation */
      .wheel {
        animation: wheelSpin 0.6s linear infinite;
        transform-origin: center;
      }
      @keyframes wheelSpin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }

      /* Track line draw */
      .track {
        stroke-dasharray: 10 8;
        animation: trackScroll 1s linear infinite;
      }
      @keyframes trackScroll {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: -18; }
      }

      /* Station markers */
      .station-dot {
        animation: stationPulse 3s ease-in-out infinite;
      }
      @keyframes stationPulse {
        0%, 100% { opacity: 0.4; transform: scale(1); }
        50% { opacity: 0.8; transform: scale(1.2); }
      }

      /* Station labels fade in */
      .station-label {
        opacity: 0;
        animation: labelIn 1s ease-out forwards;
      }
      .sl1 { animation-delay: 0.5s; }
      .sl2 { animation-delay: 1s; }
      .sl3 { animation-delay: 1.5s; }
      .sl4 { animation-delay: 2s; }
      .sl5 { animation-delay: 2.5s; }

      @keyframes labelIn {
        0% { opacity: 0; transform: translateY(5px); }
        100% { opacity: 1; transform: translateY(0); }
      }

      /* Progress fill */
      .progress-fill {
        animation: fillProgress 4s ease-out 0.5s forwards;
      }
      @keyframes fillProgress {
        0% { width: 0; }
      }

      /* Stars above journey */
      .journey-star { opacity: 0; }
      .js1 { animation: jsTwinkle 3s ease-in-out 0.5s infinite; }
      .js2 { animation: jsTwinkle 3s ease-in-out 1.2s infinite; }
      .js3 { animation: jsTwinkle 3s ease-in-out 2s infinite; }
      .js4 { animation: jsTwinkle 3s ease-in-out 1.5s infinite; }
      .js5 { animation: jsTwinkle 3s ease-in-out 2.5s infinite; }

      @keyframes jsTwinkle {
        0%, 100% { opacity: 0; }
        50% { opacity: 0.5; }
      }

      /* Milestone markers glow */
      .milestone-glow {
        animation: msGlow 2s ease-in-out infinite;
      }
      @keyframes msGlow {
        0%, 100% { opacity: 0.1; }
        50% { opacity: 0.3; }
      }
    </style>

    <!-- Track gradient -->
    <linearGradient id="trackGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#740001" stop-opacity="0.2"/>
      <stop offset="30%" stop-color="#740001" stop-opacity="0.6"/>
      <stop offset="70%" stop-color="#740001" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#740001" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Progress gradient -->
    <linearGradient id="progressGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#740001"/>
      <stop offset="50%" stop-color="#9B1B1B"/>
      <stop offset="100%" stop-color="#EEBA30"/>
    </linearGradient>

    <!-- Train body gradient -->
    <linearGradient id="trainBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9B1B1B"/>
      <stop offset="50%" stop-color="#740001"/>
      <stop offset="100%" stop-color="#4A0000"/>
    </linearGradient>
  </defs>

  <!-- ═══ Title ═══ -->
  <text x="400" y="22" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" letter-spacing="4" fill="#EEBA30" opacity="0.6">
    PLATFORM 9¾ — CODING JOURNEY
  </text>

  <!-- ═══ Stars ═══ -->
  <circle class="journey-star js1" cx="150" cy="15" r="1" fill="#FCE074"/>
  <circle class="journey-star js2" cx="320" cy="10" r="0.8" fill="#EEBA30"/>
  <circle class="journey-star js3" cx="500" cy="18" r="1" fill="#FCE074"/>
  <circle class="journey-star js4" cx="650" cy="12" r="0.8" fill="#EEBA30"/>
  <circle class="journey-star js5" cx="750" cy="16" r="1" fill="#FCE074"/>

  <!-- ═══ Track ═══ -->
  <!-- Track bed -->
  <rect x="60" y="78" width="680" height="4" rx="2" fill="#1A0000" opacity="0.3"/>
  <!-- Rail lines -->
  <line class="track" x1="60" y1="78" x2="740" y2="78" stroke="url(#trackGrad)" stroke-width="1.5"/>
  <line class="track" x1="60" y1="82" x2="740" y2="82" stroke="url(#trackGrad)" stroke-width="1.5"/>

  <!-- ═══ Progress bar underneath track ═══ -->
  <rect x="60" y="86" width="680" height="3" rx="1.5" fill="#1A0000" opacity="0.2"/>
  <rect class="progress-fill" x="60" y="86" width="476" height="3" rx="1.5" fill="url(#progressGrad)" opacity="0.5"/>

  <!-- ═══ Station / Milestone Markers ═══ -->
  <!-- Station 1: Hello World -->
  <g>
    <circle class="station-dot" cx="94" cy="80" r="4" fill="#740001" stroke="#EEBA30" stroke-width="0.5" opacity="0.6"/>
    <circle class="milestone-glow" cx="94" cy="80" r="8" fill="#EEBA30" opacity="0.1"/>
    <text class="station-label sl1" x="94" y="105" text-anchor="middle" font-family="Georgia, serif" font-size="8" fill="#8b949e" letter-spacing="1">HELLO</text>
    <text class="station-label sl1" x="94" y="115" text-anchor="middle" font-family="Georgia, serif" font-size="8" fill="#8b949e" letter-spacing="1">WORLD</text>
  </g>

  <!-- Station 2: First PR -->
  <g>
    <circle class="station-dot" cx="230" cy="80" r="4" fill="#740001" stroke="#EEBA30" stroke-width="0.5" opacity="0.6"/>
    <circle class="milestone-glow" cx="230" cy="80" r="8" fill="#EEBA30" opacity="0.1"/>
    <text class="station-label sl2" x="230" y="105" text-anchor="middle" font-family="Georgia, serif" font-size="8" fill="#8b949e" letter-spacing="1">FIRST</text>
    <text class="station-label sl2" x="230" y="115" text-anchor="middle" font-family="Georgia, serif" font-size="8" fill="#8b949e" letter-spacing="1">PR</text>
  </g>

  <!-- Station 3: Open Source -->
  <g>
    <circle class="station-dot" cx="366" cy="80" r="4" fill="#740001" stroke="#EEBA30" stroke-width="0.5" opacity="0.6"/>
    <circle class="milestone-glow" cx="366" cy="80" r="8" fill="#EEBA30" opacity="0.1"/>
    <text class="station-label sl3" x="366" y="105" text-anchor="middle" font-family="Georgia, serif" font-size="8" fill="#8b949e" letter-spacing="1">OPEN</text>
    <text class="station-label sl3" x="366" y="115" text-anchor="middle" font-family="Georgia, serif" font-size="8" fill="#8b949e" letter-spacing="1">SOURCE</text>
  </g>

  <!-- Station 4: 1K Commits (current!) -->
  <g>
    <circle class="station-dot" cx="502" cy="80" r="5" fill="#EEBA30" stroke="#FCE074" stroke-width="1" opacity="0.9"/>
    <circle class="milestone-glow" cx="502" cy="80" r="12" fill="#EEBA30" opacity="0.15"/>
    <text class="station-label sl4" x="502" y="105" text-anchor="middle" font-family="Georgia, serif" font-size="8" fill="#EEBA30" font-weight="bold" letter-spacing="1">1K</text>
    <text class="station-label sl4" x="502" y="115" text-anchor="middle" font-family="Georgia, serif" font-size="8" fill="#EEBA30" font-weight="bold" letter-spacing="1">COMMITS</text>
    <!-- "You are here" indicator -->
    <text class="station-label sl4" x="502" y="60" text-anchor="middle" font-family="Georgia, serif" font-size="7" fill="#EEBA30" opacity="0.5">▼ YOU ARE HERE</text>
  </g>

  <!-- Station 5: Hogwarts (future) -->
  <g>
    <circle cx="638" cy="80" r="4" fill="#30363d" stroke="#8b949e" stroke-width="0.5" opacity="0.3"/>
    <text class="station-label sl5" x="638" y="105" text-anchor="middle" font-family="Georgia, serif" font-size="8" fill="#8b949e" opacity="0.4" letter-spacing="1">10K</text>
    <text class="station-label sl5" x="638" y="115" text-anchor="middle" font-family="Georgia, serif" font-size="8" fill="#8b949e" opacity="0.4" letter-spacing="1">COMMITS</text>
  </g>

  <!-- Station 6: Legend (far future) -->
  <g>
    <circle cx="706" cy="80" r="4" fill="#30363d" stroke="#8b949e" stroke-width="0.5" opacity="0.2"/>
    <text class="station-label sl5" x="706" y="105" text-anchor="middle" font-family="Georgia, serif" font-size="8" fill="#8b949e" opacity="0.3" letter-spacing="1">WIZARD</text>
    <text class="station-label sl5" x="706" y="115" text-anchor="middle" font-family="Georgia, serif" font-size="8" fill="#8b949e" opacity="0.3" letter-spacing="1">LEGEND</text>
  </g>

  <!-- ═══ The Hogwarts Express ═══ -->
  <g class="train">
    <!-- Smoke puffs -->
    <circle class="smoke sm1" cx="15" cy="55" r="4" fill="#8b949e" opacity="0"/>
    <circle class="smoke sm2" cx="10" cy="52" r="5" fill="#6B7280" opacity="0"/>
    <circle class="smoke sm3" cx="8" cy="48" r="6" fill="#8b949e" opacity="0"/>
    <circle class="smoke sm4" cx="5" cy="45" r="4.5" fill="#6B7280" opacity="0"/>

    <!-- Engine body -->
    <rect x="10" y="62" width="45" height="18" rx="3" fill="url(#trainBody)" stroke="#4A0000" stroke-width="0.5"/>
    <!-- Cabin -->
    <rect x="38" y="56" width="20" height="24" rx="2" fill="url(#trainBody)" stroke="#4A0000" stroke-width="0.5"/>
    <!-- Cabin window -->
    <rect x="42" y="59" width="12" height="8" rx="1" fill="#1A0000" stroke="#EEBA30" stroke-width="0.3" opacity="0.6"/>
    <!-- Window light -->
    <rect x="44" y="61" width="8" height="4" rx="0.5" fill="#EEBA30" opacity="0.3"/>
    <!-- Chimney -->
    <rect x="15" y="53" width="8" height="10" rx="1" fill="#4A0000" stroke="#3B0000" stroke-width="0.3"/>
    <!-- Chimney top -->
    <rect x="13" y="51" width="12" height="3" rx="1" fill="#3B0000"/>
    <!-- Front lamp -->
    <circle cx="10" cy="72" r="2.5" fill="#EEBA30" opacity="0.6"/>
    <circle cx="10" cy="72" r="1" fill="#FCE074"/>
    <!-- Gold trim -->
    <line x1="10" y1="68" x2="58" y2="68" stroke="#EEBA30" stroke-width="0.5" opacity="0.5"/>
    <!-- Buffer -->
    <rect x="5" y="74" width="6" height="3" rx="1" fill="#4A0000"/>

    <!-- Carriage 1 -->
    <rect x="62" y="62" width="35" height="18" rx="2" fill="#740001" stroke="#4A0000" stroke-width="0.5"/>
    <rect x="65" y="64" width="8" height="6" rx="1" fill="#1A0000" stroke="#EEBA30" stroke-width="0.2" opacity="0.4"/>
    <rect x="76" y="64" width="8" height="6" rx="1" fill="#1A0000" stroke="#EEBA30" stroke-width="0.2" opacity="0.4"/>
    <rect x="87" y="64" width="8" height="6" rx="1" fill="#1A0000" stroke="#EEBA30" stroke-width="0.2" opacity="0.4"/>
    <!-- Interior light -->
    <rect x="66" y="65" width="6" height="4" rx="0.5" fill="#EEBA30" opacity="0.15"/>
    <rect x="77" y="65" width="6" height="4" rx="0.5" fill="#EEBA30" opacity="0.15"/>
    <rect x="88" y="65" width="6" height="4" rx="0.5" fill="#EEBA30" opacity="0.15"/>

    <!-- Wheels -->
    <g class="wheel">
      <circle cx="22" cy="82" r="3.5" fill="#1A0000" stroke="#4A3728" stroke-width="1"/>
      <circle cx="22" cy="82" r="1" fill="#8b949e"/>
    </g>
    <g class="wheel">
      <circle cx="42" cy="82" r="3.5" fill="#1A0000" stroke="#4A3728" stroke-width="1"/>
      <circle cx="42" cy="82" r="1" fill="#8b949e"/>
    </g>
    <g class="wheel">
      <circle cx="72" cy="82" r="3" fill="#1A0000" stroke="#4A3728" stroke-width="0.8"/>
      <circle cx="72" cy="82" r="0.8" fill="#8b949e"/>
    </g>
    <g class="wheel">
      <circle cx="88" cy="82" r="3" fill="#1A0000" stroke="#4A3728" stroke-width="0.8"/>
      <circle cx="88" cy="82" r="0.8" fill="#8b949e"/>
    </g>

    <!-- Coupling -->
    <line x1="58" y1="75" x2="62" y2="75" stroke="#4A3728" stroke-width="1.5"/>
  </g>

  <!-- ═══ Bottom text ═══ -->
  <text x="400" y="135" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="9" letter-spacing="3" fill="#8b949e" opacity="0.35">
    THE JOURNEY NEVER ENDS — PLATFORM 9¾
  </text>
</svg>
