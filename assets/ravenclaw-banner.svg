<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 230" width="100%">
  <defs>
    <linearGradient id="ravenclawGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1A40"/>
      <stop offset="50%" stop-color="#1B2A59"/>
      <stop offset="100%" stop-color="#070E24"/>
    </linearGradient>
    <linearGradient id="bronzeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C4923E"/>
      <stop offset="50%" stop-color="#F2CF8D"/>
      <stop offset="100%" stop-color="#946B2D"/>
    </linearGradient>
    <pattern id="ravenStars" x="0" y="0" width="100" height="100" patternUnits="userSpaceOnUse">
      <circle cx="25" cy="25" r="1.0" fill="#C4923E" opacity="0.6"/>
      <circle cx="75" cy="55" r="1.5" fill="#FFFFFF" opacity="0.7"/>
    </pattern>
    <style>
      .bg { fill: url(#ravenclawGrad); }
      .title { font-family: 'Cinzel', 'Georgia', serif; font-weight: 700; fill: url(#bronzeGrad); font-size: 38px; letter-spacing: 4px; }
      .subtitle { font-family: 'Courier New', monospace; font-size: 16px; fill: #C4923E; opacity: 0.9; letter-spacing: 2px; }
      .motto { font-family: 'Georgia', serif; font-style: italic; font-size: 14px; fill: #E5E7EB; opacity: 0.85; }
      .border-line { stroke: url(#bronzeGrad); stroke-width: 2; fill: none; }
      .corner-symbol { fill: #C4923E; opacity: 0.8; }
    </style>
  </defs>
  <rect x="5" y="5" width="890" height="220" rx="15" class="bg" stroke="#C4923E" stroke-width="2"/>
  <rect x="15" y="15" width="870" height="200" rx="10" class="border-line" stroke-dasharray="8 4"/>
  <rect x="20" y="20" width="860" height="190" rx="8" class="bg"/>
  <rect x="10" y="10" width="880" height="210" rx="12" fill="url(#ravenStars)" />
  <path d="M 30 30 L 50 30 L 30 50 Z" class="corner-symbol"/>
  <path d="M 870 30 L 850 30 L 870 50 Z" class="corner-symbol"/>
  <path d="M 30 200 L 50 200 L 30 180 Z" class="corner-symbol"/>
  <path d="M 870 200 L 850 200 L 870 180 Z" class="corner-symbol"/>
  <text x="450" y="70" text-anchor="middle" class="subtitle">🦅 WIT BEYOND MEASURE 🦅</text>
  <text x="450" y="120" text-anchor="middle" class="title">RAVENCLAW DEVELOPER</text>
  <text x="450" y="160" text-anchor="middle" class="motto">"Wit beyond measure is man's greatest treasure."</text>
  <text x="450" y="188" text-anchor="middle" class="subtitle">🦅 WISDOM • INTELLECT • CREATIVITY 🦅</text>
</svg>
